services:
  - type: web
    name: reservas-deportivas-app
    runtime: static
    rootDir: reservas-deportivas-app
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://api-reservas-deportivas-xo3s.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
